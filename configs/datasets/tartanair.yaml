# TartanAir Dataset Configuration
# Official page: https://tartanair.org/
# Tools: https://github.com/castacks/tartanair_tools

dataset: tartanair

# Path to dataset root (update to your local path)
root: data/tartanair

# Environment / difficulty / trajectory
environment: ocean
difficulty: Easy
trajectory: P000

# Camera stream to use
camera_stream: image_left

# Camera intrinsics (standard TartanAir left camera)
# Source: TartanAir documentation
camera:
  fx: 320.0
  fy: 320.0
  cx: 320.0
  cy: 240.0
  k1: 0.0
  k2: 0.0
  p1: 0.0
  p2: 0.0
  width: 640
  height: 480

# Ground-truth convention
# pose_left.txt format: x y z qx qy qz qw (one pose per line, NED body frame)
# Requires coordinate conversion: NED body → camera frame
# Convention after conversion: camera-to-world (T_wc)
gt_convention: ned_body         # raw file convention
internal_convention: camera_to_world  # after conversion

# Frame range (null = use all frames)
frame_start: null
frame_end: null
frame_step: 1
