# Experiment: ORB detector + ORB descriptor (Baseline)
# Config C in the benchmark matrix — primary baseline

experiment_id: orb_orb_v1
description: "ORB detector and descriptor — rotation-invariant baseline configuration"

detector:
  name: ORB
  nfeatures: 2000
  scale_factor: 1.2
  nlevels: 8
  edge_threshold: 31
  first_level: 0
  wta_k: 2
  patch_size: 31
  fast_threshold: 20

descriptor:
  name: ORB
  # ORB descriptor is computed jointly with the detector
  # All parameters are shared with detector above

matching:
  method: hamming
  cross_check: false
  ratio_threshold: 0.75

ransac:
  method: RANSAC
  threshold: 1.0
  confidence: 0.999
  max_iterations: 2000

tracking:
  min_keypoints: 8
  min_matches: 8
  min_inlier_ratio: 0.10
