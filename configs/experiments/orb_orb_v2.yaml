# ORB+ORB Tuned v2 -- higher keypoint count for dense scenes
experiment_id: orb_orb_v2
description: 'ORB+ORB with 3000 features and looser FAST threshold'
detector:
  name: ORB
  nfeatures: 3000
  scale_factor: 1.2
  nlevels: 8
  edge_threshold: 19
  fast_threshold: 10
descriptor:
  name: ORB
matching:
  method: hamming
  ratio_threshold: 0.75
  cross_check: false
ransac:
  method: RANSAC
  threshold: 1.0
  confidence: 0.999
  max_iterations: 3000
tracking:
  min_keypoints: 8
  min_matches: 8
  min_inlier_ratio: 0.10

