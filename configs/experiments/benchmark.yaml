# Benchmark: run all valid configurations
# Iterates over all experiment configs on a given dataset

experiment_id: benchmark_all_v1
description: "Full benchmark across all implemented feature configurations"

configs:
  - configs/experiments/orb_orb.yaml      # Baseline (run first)
  - configs/experiments/fast_orb.yaml
  - configs/experiments/fast_brief.yaml
  - configs/experiments/orb_brisk.yaml
  - configs/experiments/faster_orb.yaml   # Proposed enhancement

datasets:
  - configs/datasets/icl_nuim.yaml
  - configs/datasets/icl_nuim_office.yaml
  - configs/datasets/tartanair.yaml
  - configs/datasets/tartanair_abandonedfactory.yaml

output:
  root: results/
  save_per_frame_csv: true
  save_summary_csv: true
  save_figures: true
  save_logs: true

