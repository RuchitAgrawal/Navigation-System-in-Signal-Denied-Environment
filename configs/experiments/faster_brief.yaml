# Configuration: Adaptive FASTER + BRIEF descriptor
# High-speed binary feature extraction with dynamic contrast convergence

experiment_id: faster_brief_v1
description: "Adaptive FASTER detector paired with BRIEF binary descriptor"

detector:
  name: FASTER
  initial_threshold: 20
  min_threshold: 7
  max_threshold: 60
  target_features: 2000
  nonmax_suppression: true

descriptor:
  name: BRIEF
  bytes: 32
  use_orientation: false

bucketing:
  strategy: quadtree
  max_features: 2000
  min_cell_size: 12.0

refinement:
  subpixel: true
  win_size: [5, 5]

matching:
  norm_type: NORM_HAMMING
  cross_check: false
  ratio_threshold: 0.75

ransac:
  threshold: 1.0
  confidence: 0.999
  max_iterations: 2000

tracking:
  min_keypoints: 8
  min_matches: 8
  min_inlier_ratio: 0.10
